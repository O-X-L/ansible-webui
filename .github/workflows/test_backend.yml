---

name: Test Backend

on:
  workflow_dispatch:
  push:
    branches: [latest]
    paths:
      - '**.py'
      - 'test/integration/api/**'
      - 'requirements.txt'
      - 'requirements_test_backend.txt'
      - '.github/workflows/test_backend.yml'

  pull_request:
    branches: [latest]
    paths:
      - '**.py'
      - 'test/integration/api/**'
      - 'requirements.txt'
      - 'requirements_test_backend.txt'
      - '.github/workflows/test_backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        shell: bash

    services:
      mariadb:
        image: mariadb:latest
        ports:
          - '3306:3306'
        env:
          MARIADB_ROOT_PASSWORD: 'test'
          MARIADB_DATABASE: 'aw'

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Install python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt >/dev/null
          pip install -r requirements_test_backend.txt >/dev/null

          mkdir -p /tmp/migrations
          mv src/oxl_ansible_webui/aw/migrations/* /tmp/migrations/

      - name: Testing DB migrations for errors (1/3)
        run: |
          export AW_DB="/tmp/$(date +%s).e1.aw.db"
          rm -rf aw/migrations/*
          python3 manage.py makemigrations
        working-directory: src/oxl_ansible_webui/

      - name: Testing DB migrations for warnings (1/3)
        run: |
          export AW_DB="/tmp/$(date +%s).w1.aw.db"
          rm -rf aw/migrations/*
          m1=$(python3 manage.py makemigrations 2>&1)
          echo "$m1"
          if echo "$m1" | grep -q 'WARNING'; then exit 1;fi
        working-directory: src/oxl_ansible_webui/

      - name: Testing DB migrations for errors (2/3)
        run: |
          export AW_DB="/tmp/$(date +%s).e2.aw.db"
          rm -rf aw/migrations/*
          python3 manage.py makemigrations aw
        working-directory: src/oxl_ansible_webui/

      - name: Testing DB migrations for warnings (2/3)
        run: |
          export AW_DB="/tmp/$(date +%s).w2.aw.db"
          rm -rf aw/migrations/*
          m2=$(python3 manage.py makemigrations aw 2>&1)
          echo "$m2"
          if echo "$m2" | grep -q 'WARNING'; then exit 1;fi
        working-directory: src/oxl_ansible_webui/

      - name: Testing DB migrations for errors (3/3)
        run: |
          export AW_DB="/tmp/$(date +%s).e3.aw.db"
          python3 manage.py migrate
        working-directory: src/oxl_ansible_webui/

      - name: Testing DB migrations for warnings (3/3)
        run: |
          export AW_DB="/tmp/$(date +%s).w3.aw.db"
          m3=$(python3 manage.py migrate 2>&1)
          echo "$m3"
          if echo "$m3" | grep -q 'WARNING'; then exit 1;fi
        working-directory: src/oxl_ansible_webui/

      - name: Testing to start Ansible-WebUI
        run: |
          set +e
          export AW_DB="/tmp/$(date +%s).aw.db"
          rm -rf src/oxl_ansible_webui/aw/migrations/*
          cp /tmp/migrations/* src/oxl_ansible_webui/aw/migrations/
          timeout 10 python3 src/oxl_ansible_webui
          ec="$?"
          if [[ "$ec" != "124" ]]
          then
            exit 1
          fi
        env:
          PYTHONUNBUFFERED: 1

      - name: Running Unit Tests
        run: |
          pytest --version
          python3 -m pytest
        env:
          PYTHONUNBUFFERED: 1

      - name: Running API Integration Tests
        run: |
          rm -rf src/oxl_ansible_webui/aw/migrations/*
          cp /tmp/migrations/* src/oxl_ansible_webui/aw/migrations/
          bash scripts/test_api.sh
        env:
          PYTHONUNBUFFERED: 1

      - name: Testing database - MariaDB/MySQL
        run: bash scripts/test_db_mariadb.sh
        env:
          AW_DB_HOST: 'mariadb'

---

name: Test Frontend

on:
  workflow_dispatch:
  push:
    branches: [latest]
    paths:
      - '**.js'
      - '**.ts'
      - '**.svelte'
      - '**.html'
      - 'frontend/*.json'
      - 'frontend/*.config.js'
      - 'frontend/*.config.ts'
      - 'test/integration/auth/**'
      - 'test/integration/webui/**'
      - 'src/oxl_ansible_webui/aw/migrations/*.py'  # to be released
      - 'requirements.txt'
      - 'requirements_test_frontend.txt'
      - '.github/workflows/test_frontend.yml'

  pull_request:
    branches: [latest]
    paths:
      - '**.js'
      - '**.ts'
      - '**.svelte'
      - '**.html'
      - 'frontend/*.json'
      - 'frontend/*.config.js'
      - 'frontend/*.config.ts'
      - 'test/integration/auth/**'
      - 'test/integration/webui/**'
      - 'src/oxl_ansible_webui/aw/migrations/*.py'  # to be released
      - 'requirements.txt'
      - 'requirements_test_frontend.txt'
      - '.github/workflows/test_frontend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Install python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23.x'

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt >/dev/null
          pip install -r requirements_test_frontend.txt >/dev/null

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend/

      - name: Building frontend
        run: bash scripts/frontend/build.sh

      - name: Running Integration Tests
        run: |
          set +e
          for i in {1..3}
          do
            if (( i > 1 ))
            then
              echo "### RETRY $(( i - 1 )) ###"
            fi

            bash scripts/test_webui.sh
            if [[ "$?" == "0" ]]
            then
              exit 0
            fi
          done
          exit 1
        env:
          PYTHONUNBUFFERED: 1

      - name: Install AUTH SAML dependencies
        run: |
          sudo apt install xmlsec1 >/dev/null
          pip install grafana-django-saml2-auth >/dev/null

      - name: Running Integration Tests - AUTH SAML
        run: |
          set +e
          if pgrep -f oxl_ansible_webui
          then
            pkill -f oxl_ansible_webui
            sleep 5
          fi

          for i in {1..3}
          do
            if (( i > 1 ))
            then
              echo "### RETRY $(( i - 1 )) ###"
            fi

            bash scripts/test_auth_saml.sh
            if [[ "$?" == "0" ]]
            then
              exit 0
            fi
          done
          exit 1
        env:
          PYTHONUNBUFFERED: 1

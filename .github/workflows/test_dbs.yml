---

name: Test Databases

on:
  workflow_dispatch:
  push:
    branches: [latest]
    paths:
      - 'src/oxl_ansible_webui/db.py'
      - '.github/workflows/test_dbs.yml'

  pull_request:
    branches: [latest]
    paths:
      - 'src/oxl_ansible_webui/db.py'
      - '.github/workflows/test_dbs.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        shell: bash

    services:
      test_mariadb:
        image: 'mariadb:latest'
        options: >
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
        ports:
          - '127.0.0.1:3306:3306'
        env:
          MARIADB_ROOT_PASSWORD: 'test'
          MARIADB_DATABASE: 'aw'

      test_psql:
        image: 'postgres:latest'
        options: >
          --health-cmd="pg_isready"
        ports:
          - '127.0.0.1:5432:5432'
        env:
          POSTGRES_PASSWORD: 'test'
          POSTGRES_DB: 'aw'

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Install python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt >/dev/null
          pip install -r requirements_test_backend.txt >/dev/null

      - name: Testing SQLite
        run: |
          set +e
          for i in {1..3}
          do
            if (( i > 1 ))
            then
              echo "### RETRY $(( i - 1 )) ###"
            fi

            bash scripts/test_db_sqlite.sh
            if [[ "$?" == "0" ]]
            then
              exit 0
            fi
          done
          exit 1
        env:
          PYTHONUNBUFFERED: 1

      - name: Install MariaDB/MySQL dependencies
        run: |
          sudo apt install default-libmysqlclient-dev >/dev/null 2>/dev/null
          pip install mysqlclient >/dev/null

      - name: Testing MariaDB/MySQL
        run: |
          set +e
          for i in {1..3}
          do
            if (( i > 1 ))
            then
              echo "### RETRY $(( i - 1 )) ###"
            fi

            bash scripts/test_db_mariadb.sh
            if [[ "$?" == "0" ]]
            then
              exit 0
            fi
          done
          exit 1
        env:
          PYTHONUNBUFFERED: 1

      - name: Install PostgreSQL dependencies
        run: |
          pip install psycopg[binary,pool] >/dev/null

      - name: Testing PostgreSQL
        run: |
          set +e
          for i in {1..3}
          do
            if (( i > 1 ))
            then
              echo "### RETRY $(( i - 1 )) ###"
            fi

            bash scripts/test_db_psql.sh
            if [[ "$?" == "0" ]]
            then
              exit 0
            fi
          done
          exit 1
        env:
          PYTHONUNBUFFERED: 1

---

name: Test Job-Execution

on:
  workflow_dispatch:
  push:
    branches: [latest]
    paths:
      - '**.py'
      - 'test/integration/**.yml'
      - 'test/integration/job-exec/**'
      - 'requirements.txt'
      - 'requirements_test_backend.txt'
      - '.github/workflows/test_job_execution.yml'

  pull_request:
    branches: [latest]
    paths:
      - '**.py'
      - 'test/integration/**.yml'
      - 'test/integration/job-exec/**'
      - 'requirements.txt'
      - 'requirements_test_backend.txt'
      - '.github/workflows/test_job_execution.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Install python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt >/dev/null
          pip install -r requirements_test_backend.txt >/dev/null

      - name: Running Job-Execution Integration Tests
        run: |
          set +e
          for i in {1..3}
          do
            if (( i > 1 ))
            then
              echo "### RETRY $(( i - 1 )) ###"
            fi

            bash scripts/test_job_exec.sh
            if [[ "$?" == "0" ]]
            then
              exit 0
            fi
          done
          exit 1
        env:
          PYTHONUNBUFFERED: 1

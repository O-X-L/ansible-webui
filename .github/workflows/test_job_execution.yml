---

name: Test Job-Execution

on:
  workflow_dispatch:
  push:
    branches: [latest]
    paths:
      - '**.py'
      - 'test/integration/**.yml'
      - 'test/integration/job-exec/**'
      - 'requirements.txt'
      - 'requirements_test_backend.txt'
      - '.github/workflows/test_job_execution.yml'

  pull_request:
    branches: [latest]
    paths:
      - '**.py'
      - 'test/integration/**.yml'
      - 'test/integration/job-exec/**'
      - 'requirements.txt'
      - 'requirements_test_backend.txt'
      - '.github/workflows/test_job_execution.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ansible-runner
          - ansible_executor: 'ansible-runner'
            python_version: '3.12'
            ansible_engine: 'local'

          # failing with >3.13 - see issue: #52
          # - ansible_executor: 'ansible-runner'
          #   python_version: '3.13'
          #
          # - ansible_executor: 'ansible-runner'
          #   python_version: '3.14'

          # oxl-ansible-executor
          - ansible_executor: 'oxl-ansible-executor'
            python_version: '3.12'
            ansible_engine: 'local'

          - ansible_executor: 'oxl-ansible-executor'
            python_version: '3.12'
            ansible_engine: 'docker'

          - ansible_executor: 'oxl-ansible-executor'
            python_version: '3.13'
            ansible_engine: 'local'

          - ansible_executor: 'oxl-ansible-executor'
            python_version: '3.13'
            ansible_engine: 'docker'

          - ansible_executor: 'oxl-ansible-executor'
            python_version: '3.14'
            ansible_engine: 'local'

          - ansible_executor: 'oxl-ansible-executor'
            python_version: '3.14'
            ansible_engine: 'docker'

    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python_version }}"

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt >/dev/null
          pip install -r requirements_test_backend.txt >/dev/null

      - name: Running Job-Execution Integration Tests
        run: |
          set +e
          if [[ "${{ matrix.ansible_executor }}" == "oxl-ansible-executor" ]]
          then
            export AW_EXECUTOR=1
          else
            export AW_EXECUTOR=0
          fi
          if [[ "${{ matrix.ansible_engine }}" == "docker" ]]
          then
            export AW_ENGINE=1
          else
            export AW_ENGINE=0
          fi

          for i in {1..3}
          do
            if (( i > 1 ))
            then
              echo "### RETRY $(( i - 1 )) ###"
            fi

            bash scripts/test_job_exec.sh
            if [[ "$?" == "0" ]]
            then
              exit 0
            fi
          done
          exit 1
        env:
          PYTHONUNBUFFERED: 1

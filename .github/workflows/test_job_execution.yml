---

name: Test Job-Execution

on:
  push:
    branches: [latest]
    paths:
      - '**.py'
      - 'test/integration/**.yml'
      - 'test/integration/job-exec/**'
      - 'requirements.txt'
      - 'requirements_test_backend.txt'
      - '.github/workflows/test_job_execution.yml'

  pull_request:
    branches: [latest]
    paths:
      - '**.py'
      - 'test/integration/**.yml'
      - 'test/integration/job-exec/**'
      - 'requirements.txt'
      - 'requirements_test_backend.txt'
      - '.github/workflows/test_job_execution.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Install python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt >/dev/null
          pip install -r requirements_test_backend.txt >/dev/null

      - name: Running Job-Execution Integration Tests
        run: bash scripts/test_job_exec.sh
        env:
          PYTHONUNBUFFERED: 1
